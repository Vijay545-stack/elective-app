<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Build forms and quizzes with short answer, multiple choice, checkboxes, dropdowns, and seat-limited elective picks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23673ab7'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3EF%3C/text%3E%3C/svg%3E">
<title>Form Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#4F3CC9; --purple-dark:#3F2FA6; --purple-soft:#EEEBFB;
    --teal:#0E8074; --teal-soft:#E3F5F2;
    --bg:#F6F5FA; --card:#fff;
    --line:#E6E3F1; --line-soft:#F0EEF8; --text:#181524; --muted:#66647A;
    --red:#D0271D; --red-soft:#FCEBEA; --green:#0E8074; --green-soft:#E3F5F2; --amber:#B4560A; --amber-soft:#FCF0E3;
    --shadow-sm: 0 1px 2px rgba(24,21,36,.05), 0 1px 3px rgba(24,21,36,.06);
    --shadow-md: 0 4px 12px rgba(24,21,36,.08), 0 1px 3px rgba(24,21,36,.05);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; -webkit-font-smoothing:antialiased;}
  .page{max-width:760px; margin:0 auto; padding:32px 16px 80px;}
  .top-bar{display:none;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:26px 24px; margin-bottom:20px;}
  .card.question{border-radius:var(--radius);}
  h1.static-title{font-family:'Google Sans','Roboto',sans-serif; font-size:26px; font-weight:500; letter-spacing:-.01em; margin:0 0 8px; color:var(--text);}
  p.static-desc{font-size:14.5px; line-height:1.55; color:var(--muted); margin:0; white-space:pre-wrap;}
  .title-input,.desc-input{width:100%; border:none; border-bottom:1.5px solid var(--line); padding:8px 0; font-family:'Google Sans','Roboto',sans-serif; background:transparent; color:var(--text); transition:border-color .15s;}
  .title-input{font-size:24px; font-weight:500; margin-bottom:8px;}
  .desc-input{font-size:14px; color:var(--muted); resize:vertical; min-height:40px;}
  .title-input:focus,.desc-input:focus,input:focus,textarea:focus,select:focus{outline:none; border-bottom:2px solid var(--purple);}
  .q-label{font-size:14.5px; font-weight:500; margin-bottom:12px; color:var(--text);}
  .required{color:var(--red); margin-left:2px;}
  .field-input{width:100%; border:none; border-bottom:1.5px solid var(--line); padding:9px 2px; font-size:14px; font-family:'Roboto',sans-serif; color:var(--text); background:transparent; transition:border-color .15s;}
  .field-input.narrow{max-width:400px;}
  select.field-input{background:transparent; -webkit-appearance:none; appearance:none;}
  .elective-row{display:flex; gap:12px; align-items:center; margin-bottom:14px;}
  .elective-row .field-input{flex:1;}
  .elective-row .vacancy-input{width:110px; flex:none;}
  .remove-row{background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; line-height:1; padding:4px 8px; border-radius:6px; transition:background .15s,color .15s;}
  .remove-row:hover{color:var(--red); background:var(--red-soft);}
  .add-row-btn{background:#fff; border:1.5px dashed var(--line); color:var(--purple); padding:10px 16px; border-radius:8px; font-family:'Google Sans','Roboto',sans-serif; font-weight:500; font-size:13.5px; cursor:pointer; margin-top:4px; transition:background .15s,border-color .15s;}
  .add-row-btn:hover{background:var(--purple-soft); border-color:var(--purple);}
  .actions-row{display:flex; justify-content:flex-end; align-items:center; gap:16px; margin-top:8px;}
  .btn{font-family:'Google Sans','Roboto',sans-serif; font-size:14px; font-weight:500; padding:11px 26px; border-radius:8px; border:none; cursor:pointer; transition:background .15s,box-shadow .15s,transform .05s;}
  .btn-primary{background:var(--purple); color:#fff; box-shadow:0 2px 6px rgba(79,60,201,.28);}
  .btn-primary:hover{background:var(--purple-dark); box-shadow:0 3px 10px rgba(79,60,201,.34);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:disabled{background:#CFCBEB; box-shadow:none; cursor:not-allowed;}
  .btn-secondary{background:#fff; color:var(--purple); border:1.5px solid var(--line);}
  .btn-secondary:hover{background:var(--purple-soft); border-color:var(--purple);}
  .btn-text{background:none; color:var(--purple);}
  .option{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line-soft); border-radius:6px; transition:background .12s;}
  .option:hover{background:var(--purple-soft);}
  .option:last-child{border-bottom:none;}
  .option input[type=radio],.option input[type=checkbox]{accent-color:var(--purple); width:18px; height:18px;}
  .option label{flex:1; font-size:14px; cursor:pointer;}
  .seat-tag{font-size:11.5px; font-weight:500; font-family:'Roboto Mono',monospace; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .seat-open{color:var(--green); background:var(--green-soft);}
  .seat-filling{color:var(--amber); background:var(--amber-soft);}
  .seat-full{color:var(--red); background:var(--red-soft);}
  .option.disabled label{color:var(--muted);}
  .option.disabled:hover{background:transparent;}
  .link-box{display:flex; gap:8px; align-items:center; background:var(--purple-soft); border:1.5px solid #D9D3F5; border-radius:8px; padding:12px 14px; margin-top:16px;}
  .link-box input{flex:1; border:none; background:transparent; font-family:'Roboto Mono',monospace; font-size:13px; color:var(--text);}
  .link-box input:focus{outline:none;}
  .copy-btn{background:var(--purple); color:#fff; border:none; padding:9px 16px; border-radius:7px; font-size:13px; font-weight:500; font-family:'Google Sans','Roboto',sans-serif; cursor:pointer; transition:background .15s;}
  .copy-btn:hover{background:var(--purple-dark);}
  .hint{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
  .banner{padding:13px 18px; border-radius:8px; margin-bottom:20px; font-size:14px; display:none;}
  .banner.show{display:block;}
  .banner.err{background:var(--red-soft); color:var(--red); border:1px solid #F3C9C6;}
  .banner.ok{background:var(--green-soft); color:var(--green); border:1px solid #BFE6E1;}
  .confirm{text-align:center; padding:44px 20px;}
  .confirm .check{width:56px; height:56px; line-height:56px; margin:0 auto 16px; border-radius:50%; background:var(--green-soft); color:var(--green); font-size:26px;}
  .confirm .score-box{margin-top:14px; display:inline-block; padding:10px 24px; border-radius:24px; background:var(--purple-soft); color:var(--purple); font-family:'Google Sans','Roboto',sans-serif; font-weight:700; font-size:17px;}
  .success-card{text-align:left; border-left:4px solid var(--green);}
  .success-check{width:34px; height:34px; line-height:34px; text-align:center; border-radius:50%; background:var(--green-soft); color:var(--green); font-size:16px; margin-bottom:12px;}
  .topnav{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .topnav .brand{font-family:'Google Sans','Roboto',sans-serif; font-weight:700; font-size:18px; letter-spacing:-.01em; color:var(--text); display:flex; align-items:center; gap:8px;}
  .topnav .brand::before{content:''; width:10px; height:10px; border-radius:3px; background:var(--purple); display:inline-block;}
  .topnav .who{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:10px;}
  .who-chip{width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; font-family:'Google Sans','Roboto',sans-serif;}
  .link-plain{color:var(--purple); text-decoration:none; font-size:13px; font-weight:500; cursor:pointer; transition:color .15s;}
  .link-plain:hover{color:var(--purple-dark); text-decoration:underline;}
  .form-list-item{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 4px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;}
  .form-list-item:last-child{border-bottom:none;}
  .form-card{transition:box-shadow .15s,transform .1s;}
  .form-card:hover{box-shadow:var(--shadow-md);}
  .form-list-title{font-family:'Google Sans','Roboto',sans-serif; font-size:15.5px; font-weight:500; display:flex; align-items:center; flex-wrap:wrap; gap:2px;}
  .form-list-meta{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .row-actions{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .auth-toggle{font-size:13px; color:var(--muted); margin-top:16px; text-align:center;}
  .auth-toggle a{color:var(--purple); cursor:pointer;}
  .empty-state{color:var(--muted); font-size:14px; padding:20px 4px; text-align:center;}

  .inst-header{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .inst-crest{width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg, var(--purple), #7C6AE8); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Google Sans','Roboto',sans-serif; font-weight:700; font-size:17px; flex-shrink:0;}
  .inst-text .inst-college{font-family:'Google Sans','Roboto',sans-serif; font-weight:700; font-size:15.5px; color:var(--text); line-height:1.25;}
  .inst-text .inst-dept{font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:500;}
  .field-row-pair{display:flex; gap:20px;}
  .field-row-pair > div{flex:1;}
  @media (max-width:600px){ .field-row-pair{flex-direction:column; gap:0;} }
  .responses-panel{background:#FBFAFD; border:1px solid var(--line); border-radius:10px; padding:16px; margin:12px 0 4px;}
  .pw-toggle{position:absolute; right:2px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--purple); font-size:12px; font-weight:500; font-family:'Google Sans','Roboto',sans-serif; cursor:pointer; padding:6px 4px;}

  /* --- question builder --- */
  .q-card{border:1px solid var(--line); border-left:4px solid var(--purple); border-radius:10px; padding:20px; margin-bottom:16px; background:#fff; box-shadow:var(--shadow-sm); transition:box-shadow .15s;}
  .q-card:focus-within{box-shadow:var(--shadow-md);}
  .q-card-head{display:flex; gap:12px; align-items:flex-start; margin-bottom:14px;}
  .q-card-head .q-label-input{flex:1; font-weight:500;}
  .q-type-select{width:180px; flex:none; border:1.5px solid var(--line); border-radius:7px; padding:9px 10px; font-size:13px; font-family:'Roboto',sans-serif; color:var(--text); background:#fff; cursor:pointer;}
  .q-opts{margin-top:6px;}
  .q-opt-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .q-opt-row .opt-text{flex:1;}
  .q-opt-row .opt-capacity{width:90px; flex:none;}
  .q-opt-row .opt-correct{flex:none; width:18px; height:18px; accent-color:var(--green);}
  .q-card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; border-top:1px solid var(--line-soft); padding-top:12px; flex-wrap:wrap; gap:10px;}
  .q-card-foot .left-controls{display:flex; align-items:center; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap;}
  .q-card-foot label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .points-input{width:56px; border:none; border-bottom:1.5px solid var(--line); padding:4px 2px; font-size:13px; text-align:center;}
  .remove-q{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:4px 8px; border-radius:6px; transition:background .15s,color .15s;}
  .remove-q:hover{color:var(--red); background:var(--red-soft);}
  .type-badge{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:3px 9px; border-radius:20px; background:var(--purple-soft); color:var(--purple); margin-left:8px; vertical-align:middle;}
  .quiz-toggle{display:flex; align-items:center; gap:10px; font-size:14px; margin-top:2px; color:var(--muted);}
  .quiz-toggle input{width:18px; height:18px; accent-color:var(--purple);}
  .correct-hint{font-size:12px; color:var(--muted); margin-top:2px;}

  /* --- dashboard enhancements --- */
  .dashboard-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  .dashboard-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .stat-card{background:var(--purple-soft);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat-card .stat-value{font-family:'Google Sans','Roboto',sans-serif;font-size:22px;font-weight:700;}
  .stat-card .stat-label{font-size:12px;color:var(--muted);margin-top:3px;}
  .form-card{position:relative;padding:0;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow-sm);}
  .form-card .form-main-row{display:flex;gap:0;align-items:stretch;min-height:150px;}
  .form-card .form-actions-left{display:flex;flex-direction:column;gap:0;width:128px;min-width:128px;align-items:stretch;justify-content:center;border-right:1.5px solid var(--line);background:#FBFAFD;}
  .form-card .form-actions-left .link-plain{display:flex;align-items:center;justify-content:flex-start;min-height:42px;padding:0 16px;border-bottom:1px solid var(--line-soft);font-family:'Google Sans','Roboto',sans-serif;font-size:13px;font-weight:700;letter-spacing:.01em;text-decoration:none;transition:background .15s,color .15s;}
  .form-card .form-actions-left .link-plain:last-child{border-bottom:none;}
  .form-card .form-actions-left .link-plain:hover{background:var(--purple-soft);text-decoration:none;}
  .form-card .form-actions-left .delete-form-link{color:var(--red)!important;}
  .form-card .form-actions-left .delete-form-link:hover{background:var(--red-soft);}
  .form-card .form-main-content{flex:1;min-width:0;padding:22px 24px;}
  .form-card .form-list-title{font-weight:700;font-size:17px;}
  .form-card .form-list-meta{font-size:12.5px;margin-top:7px;}
  .settings-panel{display:none;position:fixed;inset:0;background:rgba(24,21,36,.35);z-index:50;padding:24px;}
  .settings-panel.show{display:flex;align-items:center;justify-content:center;}
  .settings-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-md);}
  .setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft);}
  .setting-row:last-child{border-bottom:none;}
  .setting-title{font-weight:500;font-size:14px;}
  .setting-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;}
  .wallpaper-preview{width:110px;height:62px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center;background-color:var(--bg);}
  .settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  body.wallpaper-active{background-size:contain;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  body.wallpaper-active .page{background:rgba(246,245,250,.76);border-radius:18px;}
  @media(max-width:650px){.stats-grid{grid-template-columns:1fr;}.form-card .form-main-row{flex-direction:column;}.form-card .form-actions-left{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1.5px solid var(--line);}.form-card .form-actions-left .link-plain{flex:1 1 30%;justify-content:center;border-bottom:none;border-right:1px solid var(--line-soft);}.form-card .form-actions-left .link-plain:last-child{border-right:none;}.form-card .form-main-content{padding:18px;}}

</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const app = document.getElementById('app');
const params = new URLSearchParams(window.location.search);
const formIdInUrl = params.get('form');

const QUESTION_TYPES = [
  { value: 'short_answer', label: 'Short answer' },
  { value: 'paragraph', label: 'Paragraph' },
  { value: 'multiple_choice', label: 'Multiple choice' },
  { value: 'checkboxes', label: 'Checkboxes' },
  { value: 'dropdown', label: 'Dropdown' },
  { value: 'elective', label: 'Elective (seat-limited)' }
];
const CHOICE_TYPES = ['multiple_choice', 'checkboxes', 'dropdown', 'elective'];

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str == null ? '' : str;
  return d.innerHTML;
}
async function api(path, opts={}){
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opts
  });
  return res.json();
}

boot();

async function boot(){
  if (formIdInUrl) {
    renderStudentView(formIdInUrl);
    return;
  }
  const me = await api('/api/me');
  if (me.teacher) {
    renderDashboard(me.teacher);
  } else {
    renderAuth();
  }
}

/* ============================================================
   AUTH: LOGIN / SIGNUP / FORGOT PASSWORD
============================================================ */
function passwordFieldHtml(id, label='Password'){
  return `
    <p class="q-label">${label}<span class="required">*</span></p>
    <div style="position:relative; max-width:400px;">
      <input class="field-input" id="${id}" type="password" style="padding-right:52px;">
      <button type="button" class="pw-toggle" data-target="${id}">Show</button>
    </div>
  `;
}
function wirePasswordToggles(){
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? 'Show' : 'Hide';
    });
  });
}

function renderAuth(mode='login'){
  const isLogin = mode === 'login';

  app.innerHTML = `
    <div class="top-bar"></div>
    <div class="card">
      <h1 class="static-title">${isLogin ? 'Faculty login' : 'Create a Faculty account'}</h1>
      <p class="static-desc">${isLogin ? 'Log in to create and manage forms and quizzes.' : 'One-time signup — after this you never touch any setup again.'}</p>
    </div>
    <div class="card question">
      ${!isLogin ? `<div style="margin-bottom:18px;"><p class="q-label">Your name</p><input class="field-input narrow" id="authName" type="text"></div>` : ''}
      <div style="margin-bottom:18px;">
        <p class="q-label">Email<span class="required">*</span></p>
        <input class="field-input narrow" id="authEmail" type="email">
      </div>
      <div style="margin-bottom:${isLogin ? '8px' : '18px'};">
        ${passwordFieldHtml('authPassword')}
      </div>
      ${!isLogin ? `
        <div style="margin-bottom:18px;">
          <p class="q-label">Security question<span class="required">*</span></p>
          <input class="field-input narrow" id="authSecQ" type="text" placeholder="e.g. What was your first school?">
        </div>
        <div style="margin-bottom:8px;">
          <p class="q-label">Answer<span class="required">*</span></p>
          <input class="field-input narrow" id="authSecA" type="text" placeholder="Used only if you forget your password">
        </div>
      ` : ''}
      <div class="banner" id="authBanner"></div>
      <div class="actions-row" style="justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <span class="auth-toggle" style="margin:0;">
          ${isLogin
            ? `New here? <a id="toggleAuth">Create an account</a> &nbsp;&middot;&nbsp; <a id="forgotLink">Forgot password?</a>`
            : `Already have an account? <a id="toggleAuth">Log in</a>`}
        </span>
        <button class="btn btn-primary" id="authSubmit">${isLogin ? 'Log in' : 'Sign up'}</button>
      </div>
    </div>
  `;

  wirePasswordToggles();
  document.getElementById('toggleAuth').addEventListener('click', () => renderAuth(isLogin ? 'signup' : 'login'));
  if (isLogin) {
    document.getElementById('forgotLink').addEventListener('click', () => renderForgotPassword());
  }

  document.getElementById('authSubmit').addEventListener('click', async () => {
    const banner = document.getElementById('authBanner');
    banner.className = 'banner';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const name = isLogin ? '' : document.getElementById('authName').value.trim();
    const securityQuestion = isLogin ? '' : document.getElementById('authSecQ').value.trim();
    const securityAnswer = isLogin ? '' : document.getElementById('authSecA').value.trim();

    if (!isLogin && (!securityQuestion || !securityAnswer)) {
      banner.textContent = 'Add a security question and answer — you\'ll need it if you ever forget your password.';
      banner.className = 'banner err show';
      return;
    }

    const btn = document.getElementById('authSubmit');
    btn.disabled = true;

    const result = await api(isLogin ? '/api/login' : '/api/signup', {
      method: 'POST',
      body: JSON.stringify({ email, password, name, securityQuestion, securityAnswer })
    });

    if (result.ok) {
      const me = await api('/api/me');
      renderDashboard(me.teacher);
    } else {
      banner.textContent = result.error;
      banner.className = 'banner err show';
      btn.disabled = false;
    }
  });
}

/* ---- Forgot password: email -> security question -> new password ---- */
function renderForgotPassword(){
  app.innerHTML = `
    <div class="top-bar"></div>
    <div class="card">
      <h1 class="static-title">Reset your password</h1>
      <p class="static-desc">Enter your account email to see your security question.</p>
    </div>
    <div class="card question">
      <p class="q-label">Email<span class="required">*</span></p>
      <input class="field-input narrow" id="fpEmail" type="email">
      <div class="banner" id="fpBanner1"></div>
      <div class="actions-row" style="justify-content:space-between;">

function applyDashboardAppearance(){
  const wallpaper = localStorage.getItem('ef_wallpaper');
  if (wallpaper) {
    document.body.style.backgroundImage = `url("${wallpaper}")`;
    document.body.classList.add('wallpaper-active');
  } else {
    document.body.style.backgroundImage = '';
    document.body.classList.remove('wallpaper-active');
  }
}
function openSettings(){
  const p=document.getElementById('settingsPanel'); if(!p)return;
  const w=localStorage.getItem('ef_wallpaper');
  const preview=document.getElementById('wallpaperPreview');
  preview.style.backgroundImage=w ? `url("${w}")` : '';
  p.classList.add('show');
}
function closeSettings(){ document.getElementById('settingsPanel')?.classList.remove('show'); }
function handleWallpaperUpload(e){
  const file=e.target.files && e.target.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')) return;
  if(file.size > 4*1024*1024){ alert('Please choose an image smaller than 4 MB.'); return; }
  const reader=new FileReader();
  reader.onload=()=>{ localStorage.setItem('ef_wallpaper', reader.result); applyDashboardAppearance(); openSettings(); };
  reader.readAsDataURL(file);
}
function resetDashboardAppearance(){ localStorage.removeItem('ef_wallpaper'); applyDashboardAppearance(); openSettings(); }

function wireDashboardActions(teacher, wrap){
  wrap.querySelectorAll('.view-responses-link').forEach(link => {
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      const item = e.target.closest('.form-card');
      const formId = item.dataset.formId;
      const panel = document.getElementById('responses-' + formId);
      if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
      panel.innerHTML = '<p class="empty-state">Loading responses…</p>'; panel.style.display = 'block';
      const result = await api(`/api/forms/${formId}/responses`);
      if (!result.ok || !result.responses.length) { panel.innerHTML = '<p class="empty-state">No responses yet.</p>'; return; }
      const fields = result.form.studentFields || {name:true,registerNo:true,department:true,email:true};
      const cols = [];
      if(fields.name) cols.push(['Name', r=>r.name]);
      if(fields.registerNo) cols.push(['Register No.', r=>r.registerNo]);
      if(fields.department) cols.push(['Department', r=>r.department]);
      if(fields.email) cols.push(['Email', r=>r.email]);
      const questionLabels = result.form.questions.map(q => q.label);
      panel.innerHTML = `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="text-align:left;border-bottom:1px solid var(--line);">${cols.map(c=>`<th style="padding:8px 6px;">${c[0]}</th>`).join('')}${questionLabels.map(l=>`<th style="padding:8px 6px;">${escapeHtml(l)}</th>`).join('')}${result.form.isQuiz?'<th style="padding:8px 6px;">Score</th>':''}</tr></thead><tbody>${result.responses.map(r=>{const byLabel={};r.answers.forEach(a=>byLabel[a.label]=a.value);return `<tr style="border-bottom:1px solid #f1f1f1;">${cols.map(c=>`<td style="padding:8px 6px;">${escapeHtml(c[1](r)||'')}</td>`).join('')}${questionLabels.map(l=>`<td style="padding:8px 6px;">${escapeHtml(byLabel[l]||'')}</td>`).join('')}${result.form.isQuiz?`<td style="padding:8px 6px;">${r.score??''}/${r.maxScore??''}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;
    });
  });
  wrap.querySelectorAll('.toggle-close-link').forEach(link => link.addEventListener('click', async (e) => {
    e.preventDefault(); const item=e.target.closest('.form-card'); const formId=item.dataset.formId; const closed=e.target.textContent.trim()==='Reopen';
    await api(`/api/forms/${formId}`,{method:'PATCH',body:JSON.stringify({closed:!closed})}); renderDashboard(teacher);
  }));
  wrap.querySelectorAll('.delete-form-link').forEach(link => link.addEventListener('click', async (e) => {
    e.preventDefault(); const item=e.target.closest('.form-card'); const formId=item.dataset.formId;
    if(!confirm('Delete this form and all its responses? This cannot be undone.'))return;
    await api(`/api/forms/${formId}`,{method:'DELETE'}); renderDashboard(teacher);
  }));
}

async function renderBuilder(teacher, editForm=null){
  let qCount = 0;
  const questionsEl_placeholder = null;

  app.innerHTML = `

      <div style="margin-top:18px;">

          <label><input type="checkbox" id="studentFieldName" checked> Student name</label>
          <label><input type="checkbox" id="studentFieldRegisterNo" checked> Register number</label>
          <label><input type="checkbox" id="studentFieldDepartment" checked> Department</label>
          <label><input type="checkbox" id="studentFieldEmail" checked> Email</label>

    <div class="actions-row">
      <button class="btn btn-primary" id="createBtn">Create form</button>
    </div>
    <div id="linkPanel"></div>
  `;

  document.getElementById('backLink').addEventListener('click', () => renderDashboard(teacher));

  const questionsWrap = document.getElementById('questionsWrap');
  const isQuizToggle = document.getElementById('isQuizToggle');
  const submitLabel = editForm ? 'Save changes' : 'Create form';
  document.getElementById('createBtn').textContent = submitLabel;
  if (editForm) {
    document.getElementById('formTitle').value = editForm.title || '';
    document.getElementById('formDesc').value = editForm.description || '';
    document.getElementById('formCollege').value = editForm.collegeName || '';
    document.getElementById('formDept').value = editForm.department || '';
    isQuizToggle.checked = !!editForm.isQuiz;
    const sf = editForm.studentFields || {name:true,registerNo:true,department:true,email:true};
    document.getElementById('studentFieldName').checked = sf.name !== false;
    document.getElementById('studentFieldRegisterNo').checked = sf.registerNo !== false;
    document.getElementById('studentFieldDepartment').checked = sf.department !== false;
    document.getElementById('studentFieldEmail').checked = sf.email !== false;
  }

  isQuizToggle.addEventListener('change', () => {
    questionsWrap.querySelectorAll('.q-card').forEach(card => refreshQuestionCard(card));
  });

  function optionRowHtml(text='', capacity='', correct=false){
    return `
      <div class="q-opt-row" data-opt-row>
        <input type="checkbox" class="opt-correct correct-only" ${correct ? 'checked' : ''} title="Mark as correct answer" style="display:none;">
        <input class="field-input opt-text" type="text" placeholder="Option" value="${escapeHtml(text)}">
        <input class="field-input opt-capacity elective-only" type="number" min="1" placeholder="Seats" value="${escapeHtml(capacity)}" style="display:none;">
        <button type="button" class="remove-row" data-remove-opt title="Remove">&times;</button>
      </div>
    `;
  }

  function refreshQuestionCard(card){
    const type = card.querySelector('.q-type-select').value;
    const isChoice = CHOICE_TYPES.includes(type);
    const isElective = type === 'elective';
    const isQuiz = isQuizToggle.checked;

    card.querySelector('.q-opts').style.display = isChoice ? 'block' : 'none';
    card.querySelectorAll('.elective-only').forEach(el => el.style.display = isElective ? '' : 'none');
    card.querySelectorAll('.correct-only').forEach(el => el.style.display = (isQuiz && isChoice && !isElective) ? '' : 'none');
    const pointsWrap = card.querySelector('.points-wrap');
    pointsWrap.style.display = (isQuiz && isChoice && !isElective) ? 'flex' : 'none';
    const correctHint = card.querySelector('.correct-hint');
    correctHint.style.display = (isQuiz && isChoice && !isElective) ? 'block' : 'none';

    // Multiple choice / dropdown = single correct answer (radio-like), checkboxes = multiple.
    card.querySelectorAll('.opt-correct').forEach(cb => {
      cb.dataset.multi = type === 'checkboxes' ? '1' : '0';
    });
  }

  function addQuestion(type='short_answer', label='', required=true, options=[], existingQuestion=null){
    qCount++;
    const card = document.createElement('div');
    card.className = 'q-card';
    if (existingQuestion && existingQuestion.id) card.dataset.questionId = existingQuestion.id;
    card.innerHTML = `
      <div class="q-card-head">
        <input class="field-input q-label-input" type="text" placeholder="Question" value="${escapeHtml(label)}">
        <select class="q-type-select">
          ${QUESTION_TYPES.map(t => `<option value="${t.value}" ${t.value === type ? 'selected' : ''}>${t.label}</option>`).join('')}
        </select>
      </div>
      <div class="q-opts">
        <div class="opt-rows"></div>
        <button type="button" class="add-row-btn add-opt-btn" style="margin-top:0; padding:6px 14px; font-size:13px;">+ Add option</button>
        <p class="hint correct-hint" style="display:none;">Check the box next to correct option(s). Points are earned only for a fully correct answer.</p>
      </div>
      <div class="q-card-foot">
        <div class="left-controls">
          <label><input type="checkbox" class="q-required" checked> Required</label>
          <label class="points-wrap" style="display:none;">Points <input class="points-input" type="number" min="0" value="1"></label>
        </div>
        <button type="button" class="remove-q">Delete question</button>
      </div>
    `;

    const optRows = card.querySelector('.opt-rows');
    function addOpt(text='', capacity='', correct=false, optionId=''){
      const wrapper = document.createElement('div');
      wrapper.innerHTML = optionRowHtml(text, capacity, correct);
      const row = wrapper.firstElementChild;
      if (optionId) row.dataset.optionId = optionId;
      row.querySelector('[data-remove-opt]').addEventListener('click', () => row.remove());
      row.querySelector('.opt-correct').addEventListener('change', (e) => {
        if (e.target.dataset.multi !== '1') {
          optRows.querySelectorAll('.opt-correct').forEach(cb => { if (cb !== e.target) cb.checked = false; });
        }
      });
      optRows.appendChild(row);
    }

    if (options.length) {
      options.forEach((o, i) => addOpt(o.text, o.capacity, (existingQuestion?.correctOptionIds || []).includes(o.id) || o.correct, o.id));
    } else if (CHOICE_TYPES.includes(type)) {
      addOpt(); addOpt();
    }

    card.querySelector('.add-opt-btn').addEventListener('click', () => addOpt());
    card.querySelector('.q-required').checked = required;
    card.querySelector('.q-type-select').addEventListener('change', () => {
      if (!optRows.children.length && CHOICE_TYPES.includes(card.querySelector('.q-type-select').value)) {
        addOpt(); addOpt();
      }
      refreshQuestionCard(card);
    });
    card.querySelector('.remove-q').addEventListener('click', () => card.remove());

    questionsWrap.appendChild(card);
    refreshQuestionCard(card);
    return card;
  }

  if (editForm && Array.isArray(editForm.questions) && editForm.questions.length) {
    editForm.questions.forEach(q => addQuestion(q.type, q.label, q.required, q.options || [], q));
  } else {
    addQuestion('short_answer', 'Question 1');
  }
  document.getElementById('addQBtn').addEventListener('click', () => addQuestion('short_answer', `Question ${questionsWrap.children.length + 1}`));

  let formAlreadyCreated = false;
  document.getElementById('createBtn').addEventListener('click', async () => {
    if (formAlreadyCreated) return; // guards against any repeat click on this button
    const banner = document.getElementById('builderBanner');
    banner.className = 'banner';

    const title = document.getElementById('formTitle').value.trim() || 'Untitled form';
    const description = document.getElementById('formDesc').value.trim();
    const collegeName = document.getElementById('formCollege').value.trim();
    const department = document.getElementById('formDept').value.trim();
    const isQuiz = isQuizToggle.checked;
    const studentFields = {
      name: document.getElementById('studentFieldName').checked,
      registerNo: document.getElementById('studentFieldRegisterNo').checked,
      department: document.getElementById('studentFieldDepartment').checked,
      email: document.getElementById('studentFieldEmail').checked
    };

    const questions = Array.from(questionsWrap.querySelectorAll('.q-card')).map(card => {
      const type = card.querySelector('.q-type-select').value;
      const label = card.querySelector('.q-label-input').value.trim();
      const required = card.querySelector('.q-required').checked;
      const q = { type, label, required };
      if (card.dataset.questionId) q.id = card.dataset.questionId;

      if (CHOICE_TYPES.includes(type)) {
        const optRows = Array.from(card.querySelectorAll('[data-opt-row]'));
        q.options = optRows.map(row => ({
          id: row.dataset.optionId || undefined,
          text: row.querySelector('.opt-text').value.trim(),
          capacity: row.querySelector('.opt-capacity').value
        }));
        if (isQuiz && type !== 'elective') {
          q.correctOptionIndexes = optRows
            .map((row, i) => row.querySelector('.opt-correct').checked ? i : -1)
            .filter(i => i !== -1);
          q.points = card.querySelector('.points-input').value;
        }
      }
      return q;
    }).filter(q => q.label);

    if (!questions.length){
      banner.textContent = 'Add at least one question with a label.';
      banner.className = 'banner err show';
      return;
    }

    const createBtn = document.getElementById('createBtn');
    createBtn.disabled = true;
    createBtn.textContent = editForm ? 'Saving…' : 'Creating…';

    const result = await api(editForm ? `/api/forms/${editForm.id}` : '/api/forms', {
      method: editForm ? 'PATCH' : 'POST',
      body: JSON.stringify({ title, description, collegeName, department, isQuiz, studentFields, questions })
    });

    if (!result.ok) {
      banner.textContent = result.error;
      banner.className = 'banner err show';
      createBtn.disabled = false;
      createBtn.textContent = editForm ? 'Save changes' : 'Create form';
      return;
    }

    if (editForm) {
      formAlreadyCreated = true;
      createBtn.disabled = true;
      createBtn.textContent = 'Saved';
      document.getElementById('linkPanel').innerHTML = '<div class="card question success-card"><div class="success-check">✓</div><p class="q-label" style="font-weight:500;">Changes saved successfully.</p><button class="btn btn-secondary" id="backToDashboardAfterEdit">Back to dashboard</button></div>';
      document.getElementById('backToDashboardAfterEdit').addEventListener('click', () => renderDashboard(teacher));
      return;
    }

    // Success: this button's one job (create the form) is done.
    formAlreadyCreated = true;
    createBtn.disabled = true;
    createBtn.style.display = 'none';

    const link = window.location.origin + '/?form=' + result.formId;
    document.getElementById('linkPanel').innerHTML = `
      <div class="card question success-card">
        <div class="success-check">✓</div>
        <p class="q-label" style="font-weight:500;">Form created — send this link to students</p>
        <div class="link-box">
          <input type="text" readonly value="${escapeHtml(link)}" id="shareLink">
          <button class="copy-btn" id="copyBtn">Copy link</button>
        </div>
        <p class="hint">Responses update live. Download them any time from your dashboard.</p>
        <div class="actions-row" style="justify-content:flex-start; margin-top:16px;">
          <button class="btn btn-secondary" id="backToFormsBtn">Back to your forms</button>
        </div>
      </div>
    `;
    document.getElementById('copyBtn').addEventListener('click', () => {
      const input = document.getElementById('shareLink');
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy link', 1500);
    });
    document.getElementById('backToFormsBtn').addEventListener('click', () => renderDashboard(teacher));
  });
}

/* ============================================================
   STUDENT: FILL FORM VIEW (public, no login)
============================================================ */
async function renderStudentView(formId){
  app.innerHTML = `<div class="top-bar"></div><div class="card"><p>Loading form…</p></div>`;

  const data = await api('/api/public/forms/' + encodeURIComponent(formId));
  if (!data.ok) {
    app.innerHTML = `<div class="top-bar"></div><div class="card"><p style="color:var(--red);">${escapeHtml(data.error)}</p></div>`;
    return;
  }
  const form = data.form;
  form.studentFields = form.studentFields || {name:true, registerNo:true, department:true, email:true};

  function statusInfo(el){
    if (el.remaining <= 0) return {cls:'seat-full', text:'Full'};
    if (el.remaining / el.capacity <= 0.2) return {cls:'seat-filling', text: el.remaining + ' left'};
    return {cls:'seat-open', text: el.remaining + ' left'};
  }

  const initials = (form.collegeName || '')
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(w => w[0].toUpperCase())
    .join('') || 'F';

  const instHeader = form.collegeName ? `
    <div class="inst-header">
      <div class="inst-crest">${escapeHtml(initials)}</div>
      <div class="inst-text">
        <div class="inst-college">${escapeHtml(form.collegeName)}</div>
        ${form.department ? `<div class="inst-dept">${escapeHtml(form.department)}</div>` : ''}
      </div>
    </div>
  ` : '';

  if (form.closed) {
    app.innerHTML = `
      <div class="top-bar"></div>
      <div class="card confirm">
        ${instHeader}
        <h1 class="static-title">This form is closed</h1>
        <p class="static-desc">"${escapeHtml(form.title)}" is no longer accepting responses. Please contact your department for next steps.</p>
      </div>
    `;
    return;
  }

  function questionCardHtml(q, i){
    if (q.type === 'short_answer') {
      return `<input class="field-input" data-q="${q.id}" data-type="short_answer" type="text">`;
    }
    if (q.type === 'paragraph') {
      return `<textarea class="desc-input" style="border:1px solid var(--line); border-radius:4px; padding:10px;" rows="3" data-q="${q.id}" data-type="paragraph"></textarea>`;
    }
    if (q.type === 'dropdown') {
      return `
        <select class="field-input" data-q="${q.id}" data-type="dropdown">
          <option value="">Choose…</option>
          ${q.options.map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.text)}</option>`).join('')}
        </select>
      `;
    }
    if (q.type === 'multiple_choice' || q.type === 'elective') {
      return `
        <div data-q="${q.id}" data-type="${q.type}">
          ${q.options.map((o, oi) => {
            const disabled = q.type === 'elective' && o.remaining <= 0;
            const st = q.type === 'elective' ? statusInfo(o) : null;
            return `
              <div class="option ${disabled ? 'disabled' : ''}">
                <input type="radio" name="q_${q.id}" id="q_${q.id}_${oi}" value="${escapeHtml(o.id)}" ${disabled ? 'disabled' : ''}>
                <label for="q_${q.id}_${oi}">${escapeHtml(o.text)}</label>
                ${st ? `<span class="seat-tag ${st.cls}">${st.text}</span>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }
    if (q.type === 'checkboxes') {
      return `
        <div data-q="${q.id}" data-type="checkboxes">
          ${q.options.map((o, oi) => `
            <div class="option">
              <input type="checkbox" name="q_${q.id}" id="q_${q.id}_${oi}" value="${escapeHtml(o.id)}">
              <label for="q_${q.id}_${oi}">${escapeHtml(o.text)}</label>
            </div>
          `).join('')}
        </div>
      `;
    }
    return '';
  }

  app.innerHTML = `
    <div class="top-bar"></div>
    <div class="card">
      ${instHeader}
      <h1 class="static-title">${escapeHtml(form.title)} ${form.isQuiz ? '<span class="type-badge">Quiz</span>' : ''}</h1>
      ${form.description ? `<p class="static-desc">${escapeHtml(form.description)}</p>` : ''}
    </div>
    ${form.studentFields.name ? `
    <div class="card question">
      <p class="q-label">Student name<span class="required">*</span></p>
      <input class="field-input" id="sName" type="text" required>
    </div>` : ''}
    ${form.studentFields.registerNo ? `
    <div class="card question">
      <p class="q-label">Register number<span class="required">*</span></p>
      <input class="field-input" id="sRegNo" type="text" required>
    </div>` : ''}
    ${form.studentFields.department ? `
    <div class="card question">
      <p class="q-label">Department<span class="required">*</span></p>
      <input class="field-input" id="sDept" type="text" placeholder="e.g. Computer Science" required>
    </div>` : ''}
    ${form.studentFields.email ? `
    <div class="card question">
      <p class="q-label">Email<span class="required">*</span></p>
      <input class="field-input narrow" id="sEmail" type="email" required>
    </div>` : ''}
    ${form.questions.map(q => `
      <div class="card question">
        <p class="q-label">${escapeHtml(q.label)}${q.required ? '<span class="required">*</span>' : ''}</p>
        ${questionCardHtml(q)}
      </div>
    `).join('')}
    <div class="banner" id="studentBanner"></div>
    <div class="actions-row">
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  `;

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const banner = document.getElementById('studentBanner');
    const name = document.getElementById('sName')?.value.trim() || '';
    const registerNo = document.getElementById('sRegNo')?.value.trim() || '';
    const department = document.getElementById('sDept')?.value.trim() || '';
    const email = document.getElementById('sEmail')?.value.trim() || '';

    const answers = form.questions.map(q => {
      if (q.type === 'checkboxes') {
        const checked = Array.from(document.querySelectorAll(`input[name="q_${q.id}"]:checked`)).map(el => el.value);
        return { questionId: q.id, value: checked };
      }
      if (q.type === 'multiple_choice' || q.type === 'elective') {
        const checked = document.querySelector(`input[name="q_${q.id}"]:checked`);
        return { questionId: q.id, value: checked ? checked.value : '' };
      }
      const el = document.querySelector(`[data-q="${q.id}"]`);
      return { questionId: q.id, value: el ? el.value.trim() : '' };
    });

    const missingRequired = form.questions.some(q => {
      if (!q.required) return false;
      const a = answers.find(x => x.questionId === q.id);
      return !a || (Array.isArray(a.value) ? a.value.length === 0 : !a.value);
    });

    const sf = form.studentFields || {name:true,registerNo:true,department:true,email:true};
    if ((sf.name && !name) || (sf.registerNo && !registerNo) || (sf.department && !department) || (sf.email && !email) || missingRequired){
      banner.textContent = 'Please fill in every required field.';
      banner.className = 'banner err show';
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    const result = await api(`/api/public/forms/${formId}/responses`, {
      method: 'POST',
      body: JSON.stringify({ name, registerNo, department, email, answers })
    });

    if (result.ok) {
      app.innerHTML = `
        <div class="top-bar"></div>
        <div class="card confirm">
          <div class="check">✓</div>
          <h1 class="static-title">Response recorded</h1>
          <p class="static-desc">${escapeHtml(result.message)}</p>
          ${result.maxScore != null ? `<div class="score-box">${result.score} / ${result.maxScore}</div>` : ''}
        </div>
      `;
    } else {
      banner.textContent = result.error;
      banner.className = 'banner err show';
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });
}
</script>
