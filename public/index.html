<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="College Elective Registration and Form Builder">
<title>Elective Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4f3cc9;--pd:#3f2fa6;--ps:#eeebfb;--bg:#f6f5fa;--card:#fff;--line:#e4e1ee;--text:#181524;--muted:#686579;--red:#c62828;--green:#087f6f;--amber:#b4560a;--shadow:0 4px 16px rgba(24,21,36,.08);--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif}.page{max-width:820px;margin:auto;padding:24px 15px 70px}.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;padding:13px 2px;border-bottom:1px solid var(--line)}.brand{font:700 18px 'Google Sans';display:flex;align-items:center;gap:9px}.brand:before{content:'F';display:inline-flex;width:30px;height:30px;border-radius:9px;background:var(--p);color:#fff;align-items:center;justify-content:center}.who{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:24px;margin-bottom:17px}.hero{background:linear-gradient(135deg,#fff,#f3f0ff);border-top:5px solid var(--p)}h1{font:600 27px 'Google Sans';margin:0 0 8px;letter-spacing:-.02em}.desc{font-size:14px;line-height:1.6;color:var(--muted);white-space:pre-wrap}.label{font-size:14px;font-weight:500;margin:0 0 9px}.required{color:var(--red)}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;color:var(--text);font:14px Roboto}.textarea{resize:vertical;min-height:70px}.input:focus,.select:focus,.textarea:focus{outline:2px solid rgba(79,60,201,.15);border-color:var(--p)}.narrow{max-width:430px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{border:0;border-radius:8px;padding:11px 20px;font:500 14px 'Google Sans';cursor:pointer}.primary{background:var(--p);color:#fff}.primary:hover{background:var(--pd)}.primary:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#fff;color:var(--p);border:1px solid var(--line)}.textbtn,.link{color:var(--p);background:none;border:0;cursor:pointer;text-decoration:none;font-size:13px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px;flex-wrap:wrap}.banner{display:none;padding:12px 14px;border-radius:9px;margin:15px 0;font-size:13px}.banner.show{display:block}.err{background:#fcebea;color:var(--red);border:1px solid #f1c8c5}.ok{background:#e4f5f2;color:var(--green);border:1px solid #bde4df}.inst{display:flex;align-items:center;gap:13px;margin-bottom:17px}.crest{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--p),#7d6bea);color:#fff;display:flex;align-items:center;justify-content:center;font:700 18px 'Google Sans';flex:none}.college{font:700 16px 'Google Sans'}.dept{font-size:12px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:var(--ps);color:var(--p);font-size:11px;font-weight:700;vertical-align:middle;margin-left:5px}.seat{font-size:11px;padding:4px 9px;border-radius:20px;font-weight:600}.open{background:#e4f5f2;color:var(--green)}.filling{background:#fcf0e3;color:var(--amber)}.full{background:#fcebea;color:var(--red)}.option{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid #f0eef5;border-radius:7px}.option:hover{background:var(--ps)}.option label{flex:1;cursor:pointer;font-size:14px}.option input{width:18px;height:18px;accent-color:var(--p)}
.qcard{border:1px solid var(--line);border-left:4px solid var(--p);border-radius:10px;padding:18px;margin-bottom:14px;background:#fff}.qhead{display:grid;grid-template-columns:1fr 190px;gap:12px}.qfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0eef5;margin-top:14px;padding-top:12px;font-size:13px;color:var(--muted)}.opts{margin-top:13px}.optrow{display:grid;grid-template-columns:1fr 90px 32px;gap:8px;align-items:center;margin:9px 0}.remove{border:0;background:none;color:#777;font-size:20px;cursor:pointer}.add{border:1px dashed var(--line);background:#fff;color:var(--p);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500}.hidden{display:none!important}.success{text-align:left;border-left:4px solid var(--green)}.check{width:45px;height:45px;border-radius:50%;background:#e4f5f2;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:12px}.share{display:flex;gap:8px;padding:10px;background:var(--ps);border:1px solid #d8d1f4;border-radius:9px}.share input{flex:1;border:0;background:transparent;font-size:12px}.share button{border:0;border-radius:7px;background:var(--p);color:#fff;padding:8px 13px}.listitem{padding:16px 2px;border-bottom:1px solid #f0eef5}.listitem:last-child{border:0}.listhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{font-size:12px;color:var(--muted);margin-top:5px}.rowlinks{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:25px;font-size:14px}.toggle{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}.toggle input{width:18px;height:18px;accent-color:var(--p)}
@media(max-width:620px){.grid,.qhead{grid-template-columns:1fr}.page{padding-top:12px}.card{padding:19px}.listhead{display:block}.who{font-size:11px}.optrow{grid-template-columns:1fr 75px 28px}}
</style>
</head>
<body><main class="page" id="app"></main>
<script>
const app=document.getElementById('app');const formId=new URLSearchParams(location.search).get('form');
const TYPES=[['short_answer','Short answer'],['paragraph','Paragraph'],['multiple_choice','Multiple choice'],['checkboxes','Checkboxes'],['dropdown','Dropdown'],['elective','Elective (seat-limited)']];
const CHOICE=['multiple_choice','checkboxes','dropdown','elective'];
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});try{return await r.json()}catch{return{ok:false,error:'Invalid server response'}}}
function banner(id,msg,type='err'){const e=document.getElementById(id);if(!e)return;e.textContent=msg;e.className='banner show '+type}
function initials(s){return(s||'F').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'F'}
function institution(college,dept){return college?`<div class="inst"><div class="crest">${esc(initials(college))}</div><div><div class="college">${esc(college)}</div>${dept?`<div class="dept">${esc(dept)}</div>`:''}</div></div>`:''}
async function boot(){if(formId)return student(formId);const me=await api('/api/me');if(me.teacher)dashboard(me.teacher);else auth('login')}
function auth(mode){const login=mode==='login';app.innerHTML=`<div class="card hero"><h1>${login?'Faculty Login':'Create Faculty Account'}</h1><div class="desc">${login?'Log in to create and manage elective forms.':'Create your faculty account to build and manage forms.'}</div></div><div class="card">${!login?`<p class="label">Your name</p><input class="input narrow" id="aName" type="text">`:''}<p class="label" style="margin-top:${login?0:17}px">Email<span class="required">*</span></p><input class="input narrow" id="aEmail" type="email"><p class="label" style="margin-top:17px">Password<span class="required">*</span></p><input class="input narrow" id="aPass" type="password">${!login?`<p class="label" style="margin-top:17px">Security question<span class="required">*</span></p><input class="input narrow" id="aQ" placeholder="e.g. First school name"><p class="label" style="margin-top:17px">Answer<span class="required">*</span></p><input class="input narrow" id="aA">`:''}<div id="authErr" class="banner"></div><div class="actions"><span class="desc">${login?`New here? <a class="link" id="switch">Create account</a> · <a class="link" id="forgot">Forgot password?</a>`:`Already have an account? <a class="link" id="switch">Log in</a>`}</span><button class="btn primary" id="authBtn">${login?'Log in':'Sign up'}</button></div></div>`;
document.getElementById('switch').onclick=()=>auth(login?'signup':'login');if(login)document.getElementById('forgot').onclick=forgot;document.getElementById('authBtn').onclick=async()=>{const email=aEmail.value.trim(),password=aPass.value,name=login?'':aName.value.trim(),securityQuestion=login?'':aQ.value.trim(),securityAnswer=login?'':aA.value.trim();if(!email||!password||(!login&&(!name||!securityQuestion||!securityAnswer))){banner('authErr','Please fill all required fields.');return}authBtn.disabled=true;const r=await api(login?'/api/login':'/api/signup',{method:'POST',body:JSON.stringify({email,password,name,securityQuestion,securityAnswer})});if(r.ok){const me=await api('/api/me');dashboard(me.teacher)}else{banner('authErr',r.error||'Request failed');authBtn.disabled=false}}}
async function forgot(){app.innerHTML=`<div class="card hero"><h1>Reset Password</h1><div class="desc">Enter your faculty email to retrieve your security question.</div></div><div class="card"><p class="label">Email<span class="required">*</span></p><input class="input narrow" id="fEmail" type="email"><div id="fErr" class="banner"></div><div class="actions"><a class="link" id="back">← Back to login</a><button class="btn primary" id="next">Next</button></div></div>`;back.onclick=()=>auth('login');next.onclick=async()=>{next.disabled=true;const r=await api('/api/forgot-password/question',{method:'POST',body:JSON.stringify({email:fEmail.value.trim()})});if(r.ok)reset(fEmail.value.trim(),r.question);else{banner('fErr',r.error);next.disabled=false}}}
function reset(email,q){app.innerHTML=`<div class="card hero"><h1>Set New Password</h1></div><div class="card"><p class="label">${esc(q)}<span class="required">*</span></p><input class="input narrow" id="fAns"><p class="label" style="margin-top:17px">New password<span class="required">*</span></p><input class="input narrow" id="fNew" type="password"><div id="rErr" class="banner"></div><div class="actions"><a class="link" onclick="auth('login')">← Back</a><button class="btn primary" id="resetBtn">Reset password</button></div></div>`;resetBtn.onclick=async()=>{resetBtn.disabled=true;const r=await api('/api/forgot-password/reset',{method:'POST',body:JSON.stringify({email,answer:fAns.value.trim(),newPassword:fNew.value})});if(r.ok)auth('login');else{banner('rErr',r.error);resetBtn.disabled=false}}}
async function dashboard(t){app.innerHTML=`<div class="topnav"><div class="brand">Elective Form Builder</div><div class="who">${esc(t.name)} · <a class="link" id="logout">Log out</a></div></div><div class="card hero"><h1>Faculty Dashboard</h1><div class="desc">Create elective registration forms, manage seat limits and view student responses.</div><button class="btn primary" id="new" style="margin-top:15px">+ Create New Form</button></div><div id="list" class="card"><div class="empty">Loading forms…</div></div>`;logout.onclick=async()=>{await api('/api/logout',{method:'POST'});auth('login')};new.onclick=()=>builder(t);const r=await api('/api/forms');if(!r.ok||!r.forms?.length){list.innerHTML='<div class="empty">No forms yet. Create your first form above.</div>';return}list.innerHTML=r.forms.map(f=>{const link=location.origin+'/?form='+f.id;return `<div class="listitem" data-id="${esc(f.id)}"><div class="listhead"><div><b>${esc(f.title)}</b>${f.isQuiz?'<span class="badge">QUIZ</span>':''}<div class="meta">${[f.collegeName,f.department].filter(Boolean).map(esc).join(' · ')}${f.collegeName||f.department?' · ':''}${f.questionCount} question(s) · ${f.responseCount} response(s)</div></div><span class="seat ${f.closed?'full':'open'}">${f.closed?'Closed':'Live'}</span></div><div class="rowlinks"><a class="link" target="_blank" href="${esc(link)}">Open</a><a class="link resp">Responses</a><a class="link" href="/api/forms/${encodeURIComponent(f.id)}/export">CSV</a><a class="link close">${f.closed?'Reopen':'Close'}</a><a class="link" style="color:var(--red)" data-del>Delete</a></div><div class="responses hidden"></div></div>`}).join('');list.querySelectorAll('.close').forEach(x=>x.onclick=async e=>{e.preventDefault();const item=x.closest('[data-id]');const f=r.forms.find(z=>z.id===item.dataset.id);await api('/api/forms/'+f.id,{method:'PATCH',body:JSON.stringify({closed:!f.closed})});dashboard(t)});list.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{const item=x.closest('[data-id]');if(confirm('Delete this form and all responses?')){await api('/api/forms/'+item.dataset.id,{method:'DELETE'});dashboard(t)}});list.querySelectorAll('.resp').forEach(x=>x.onclick=async e=>{e.preventDefault();const item=x.closest('[data-id]'),p=item.querySelector('.responses');p.classList.toggle('hidden');if(p.dataset.loaded)return;p.innerHTML='<div class="empty">Loading…</div>';const z=await api('/api/forms/'+item.dataset.id+'/responses');if(!z.ok||!z.responses.length){p.innerHTML='<div class="empty">No responses yet.</div>';return}const qs=z.form.questions.map(q=>q.label);p.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Register No.</th><th>Department</th><th>Email</th>${qs.map(q=>`<th>${esc(q)}</th>`).join('')}${z.form.isQuiz?'<th>Score</th>':''}</tr></thead><tbody>${z.responses.map(v=>{const a={};v.answers.forEach(x=>a[x.label]=Array.isArray(x.value)?x.value.join(', '):x.value);return `<tr><td>${esc(v.name)}</td><td>${esc(v.registerNo)}</td><td>${esc(v.department)}</td><td>${esc(v.email)}</td>${qs.map(q=>`<td>${esc(a[q]||'')}</td>`).join('')}${z.form.isQuiz?`<td>${v.score??''}/${v.maxScore??''}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;p.dataset.loaded='1'})}
function builder(t){let count=0;app.innerHTML=`<div class="topnav"><div class="brand">Elective Form Builder</div><a class="link" id="back">← My Forms</a></div><div class="card hero"><input class="input" id="title" value="Untitled form" style="font:600 25px 'Google Sans';"><textarea class="textarea" id="desc" placeholder="Form description shown to students" style="margin-top:12px"></textarea><label class="toggle"><input id="quiz" type="checkbox"> Make this a quiz (auto-graded)</label></div><div class="card"><p class="label">Institution Details</p><div class="grid"><div><p class="label">College / Institution Name</p><input class="input" id="college" placeholder="e.g. KCG College of Technology"></div><div><p class="label">Department</p><input class="input" id="dept" placeholder="e.g. Computer Science and Engineering"></div></div><p class="desc" style="margin-top:12px">These details are displayed prominently to students on the registration page.</p></div><div id="qs"></div><button class="add" id="addq">+ Add question</button><div id="bErr" class="banner"></div><div class="actions"><button class="btn primary" id="create">Create form</button></div><div id="share"></div>`;back.onclick=()=>dashboard(t);const qwrap=document.getElementById('qs');const quiz=document.getElementById('quiz');
function addQuestion(type='short_answer',label=''){count++;const c=document.createElement('div');c.className='qcard';c.innerHTML=`<div class="qhead"><input class="input qlabel" placeholder="Question" value="${esc(label)}"><select class="select qtype">${TYPES.map(x=>`<option value="${x[0]}" ${x[0]===type?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="opts hidden"><div class="optlist"></div><button class="add addopt" type="button">+ Add option</button><div class="desc hint">For quiz mode, mark the correct answer. Elective options can have seat limits.</div></div><div class="qfoot"><label><input class="req" type="checkbox" checked> Required</label><label class="points hidden">Points <input class="input pts" type="number" min="0" value="1" style="width:60px;padding:5px"></label><button class="textbtn delq" type="button">Delete question</button></div>`;qwrap.appendChild(c);const opts=c.querySelector('.optlist');function addOpt(text='',cap='',correct=false){const row=document.createElement('div');row.className='optrow';row.innerHTML=`<input class="input ot" placeholder="Option" value="${esc(text)}"><input class="input cap" type="number" min="1" placeholder="Seats" value="${esc(cap)}"><button class="remove">×</button><label class="correct hidden"><input type="checkbox" ${correct?'checked':''}> Correct</label>`;row.querySelector('.remove').onclick=()=>row.remove();opts.appendChild(row);refresh()};c.querySelector('.addopt').onclick=()=>addOpt();c.querySelector('.delq').onclick=()=>c.remove();c.querySelector('.qtype').onchange=refresh;quiz.onchange=()=>qwrap.querySelectorAll('.qcard').forEach(refresh);function refresh(){const ty=c.querySelector('.qtype').value,isChoice=CHOICE.includes(ty),elect=ty==='elective';c.querySelector('.opts').classList.toggle('hidden',!isChoice);c.querySelectorAll('.cap').forEach(x=>x.classList.toggle('hidden',!elect));c.querySelectorAll('.correct').forEach(x=>x.classList.toggle('hidden',!(quiz.checked&&isChoice&&!elect)));c.querySelector('.points').classList.toggle('hidden',!(quiz.checked&&isChoice&&!elect));if(isChoice&&!opts.children.length){addOpt();addOpt()}}refresh();return c}
addQuestion('short_answer','Question 1');addq.onclick=()=>addQuestion('short_answer','Question '+(qwrap.children.length+1));create.onclick=async()=>{const questions=[...qwrap.children].map(c=>{const type=c.querySelector('.qtype').value,q={type,label:c.querySelector('.qlabel').value.trim(),required:c.querySelector('.req').checked};if(CHOICE.includes(type)){q.options=[...c.querySelectorAll('.optrow')].map(r=>({text:r.querySelector('.ot').value.trim(),capacity:r.querySelector('.cap').value}));if(quiz.checked&&type!=='elective'){q.correctOptionIndexes=[...c.querySelectorAll('.optrow')].map((r,i)=>r.querySelector('.correct input')?.checked?i:-1).filter(i=>i>=0);q.points=c.querySelector('.pts').value}}return q}).filter(q=>q.label);if(!questions.length){banner('bErr','Add at least one question.');return}create.disabled=true;const r=await api('/api/forms',{method:'POST',body:JSON.stringify({title:title.value.trim()||'Untitled form',description:desc.value.trim(),collegeName:college.value.trim(),department:dept.value.trim(),isQuiz:quiz.checked,questions})});if(!r.ok){banner('bErr',r.error||'Could not create form');create.disabled=false;return}create.classList.add('hidden');const link=location.origin+'/?form='+r.formId;share.innerHTML=`<div class="card success"><div class="check">✓</div><h1>Form created successfully</h1><div class="desc">Share this link with your students.</div><div class="share" style="margin-top:15px"><input readonly id="shareLink" value="${esc(link)}"><button id="copy">Copy</button></div><div class="actions" style="justify-content:flex-start"><button class="btn secondary" id="backForms">Back to forms</button><a class="link" target="_blank" href="${esc(link)}">Open form</a></div></div>`;copy.onclick=()=>{navigator.clipboard.writeText(shareLink.value);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy',1200)};backForms.onclick=()=>dashboard(t)}}
async function student(id){app.innerHTML='<div class="card"><div class="empty">Loading form…</div></div>';const d=await api('/api/public/forms/'+encodeURIComponent(id));if(!d.ok){app.innerHTML=`<div class="card"><p style="color:var(--red)">${esc(d.error)}</p></div>`;return}const f=d.form;if(f.closed){app.innerHTML=`<div class="card hero">${institution(f.collegeName,f.department)}<h1>Registration Closed</h1><div class="desc">${esc(f.title)} is no longer accepting responses.</div></div>`;return}function seat(o){if(o.remaining<=0)return'<span class="seat full">Full</span>';if(o.remaining/o.capacity<=.2)return`<span class="seat filling">${o.remaining} left</span>`;return`<span class="seat open">${o.remaining} left</span>`}function qhtml(q){if(q.type==='short_answer')return`<input class="input" data-q="${q.id}">`;if(q.type==='paragraph')return`<textarea class="textarea" data-q="${q.id}"></textarea>`;if(q.type==='dropdown')return`<select class="select" data-q="${q.id}"><option value="">Choose…</option>${q.options.map(o=>`<option value="${esc(o.id)}">${esc(o.text)}</option>`).join('')}</select>`;if(q.type==='multiple_choice'||q.type==='elective')return`<div data-q="${q.id}">${q.options.map((o,i)=>{const dis=q.type==='elective'&&o.remaining<=0;return`<div class="option"><input type="radio" name="q_${q.id}" value="${esc(o.id)}" ${dis?'disabled':''}><label>${esc(o.text)}</label>${q.type==='elective'?seat(o):''}</div>`}).join('')}</div>`;if(q.type==='checkboxes')return`<div data-q="${q.id}">${q.options.map(o=>`<div class="option"><input type="checkbox" name="q_${q.id}" value="${esc(o.id)}"><label>${esc(o.text)}</label></div>`).join('')}</div>`;return''}
app.innerHTML=`<div class="card hero">${institution(f.collegeName,f.department)}<h1>${esc(f.title)} ${f.isQuiz?'<span class="badge">QUIZ</span>':''}</h1>${f.description?`<div class="desc">${esc(f.description)}</div>`:''}</div><div class="card"><p class="label">Student Name<span class="required">*</span></p><input class="input" id="name"><p class="label" style="margin-top:16px">Register Number<span class="required">*</span></p><input class="input" id="reg"><p class="label" style="margin-top:16px">Department<span class="required">*</span></p><input class="input" id="sdept" value="${esc(f.department||'')}" placeholder="e.g. Computer Science"><p class="label" style="margin-top:16px">Email<span class="required">*</span></p><input class="input" id="email" type="email"></div>${f.questions.map(q=>`<div class="card"><p class="label">${esc(q.label)}${q.required?'<span class="required">*</span>':''}</p>${qhtml(q)}</div>`).join('')}<div id="sErr" class="banner"></div><div class="actions"><button class="btn primary" id="submit">Submit Registration</button></div>`;submit.onclick=async()=>{const answers=f.questions.map(q=>{if(q.type==='checkboxes')return{questionId:q.id,value:[...document.querySelectorAll(`input[name="q_${q.id}"]:checked`)].map(x=>x.value)};if(q.type==='multiple_choice'||q.type==='elective'){const x=document.querySelector(`input[name="q_${q.id}"]:checked`);return{questionId:q.id,value:x?x.value:''}}const x=document.querySelector(`[data-q="${q.id}"]`);return{questionId:q.id,value:x?x.value.trim():''}});const missing=f.questions.some(q=>q.required&&(!(answers.find(a=>a.questionId===q.id)?.value?.length)));if(!name.value.trim()||!reg.value.trim()||!sdept.value.trim()||!email.value.trim()||missing){banner('sErr','Please fill in every required field.');return}submit.disabled=true;submit.textContent='Submitting…';const r=await api('/api/public/forms/'+encodeURIComponent(id)+'/responses',{method:'POST',body:JSON.stringify({name:name.value.trim(),registerNo:reg.value.trim(),department:sdept.value.trim(),email:email.value.trim(),answers})});if(r.ok)app.innerHTML=`<div class="card hero" style="text-align:center">${institution(f.collegeName,f.department)}<div class="check" style="margin:15px auto">✓</div><h1>Registration Successful</h1><div class="desc">${esc(r.message||'Your response has been recorded successfully.')}</div>${r.maxScore!=null?`<div class="badge" style="font-size:16px;margin-top:15px">Score: ${r.score}/${r.maxScore}</div>`:''}</div>`;else{banner('sErr',r.error||'Submission failed');submit.disabled=false;submit.textContent='Submit Registration'}}}
boot();
</script></body></html>
