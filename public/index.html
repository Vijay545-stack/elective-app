<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elective Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
 --p:#673ab7;--pd:#5e35b1;--bg:#f0ebf8;--text:#202124;
 --muted:#5f6368;--line:#ddd;--red:#d93025;--green:#188038;
 --orange:#e37400
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial}
.page{max-width:760px;margin:auto;padding:25px 15px 70px}
.bar{height:10px;background:var(--p);border-radius:8px 8px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:18px}
.first{border-radius:0 0 8px 8px}
h1,h2{font-family:"Google Sans",Roboto;font-weight:400}
h1{font-size:28px;margin:0 0 10px}
h2{font-size:20px}
.desc,.muted{color:var(--muted);font-size:14px;white-space:pre-wrap}
.field{margin:18px 0}
label{display:block;font-size:14px;margin-bottom:7px}
.req{color:var(--red)}
input,textarea{width:100%;padding:12px;border:1px solid #aaa;border-radius:4px;font:15px Roboto}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:none;border:2px solid var(--p)}
button{padding:10px 18px;border-radius:5px;font:500 14px "Google Sans";cursor:pointer}
.primary{background:var(--p);color:#fff;border:0}
.primary:hover{background:var(--pd)}
.secondary{background:#fff;color:var(--p);border:1px solid var(--p)}
.danger{background:#fff;color:var(--red);border:1px solid #ddd}
button:disabled{opacity:.6}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.auth{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
.auth span{color:var(--p);cursor:pointer}
.error{background:#fce8e6;color:var(--red);padding:12px;border-radius:5px;margin:12px 0}
.success{background:#e6f4ea;color:var(--green);padding:12px;border-radius:5px;margin:12px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.brand{font:700 20px "Google Sans";color:var(--p)}
.user{font-size:13px;color:var(--muted);margin-top:3px}
.row{display:grid;grid-template-columns:1fr 110px 75px;gap:8px;margin:10px 0}
.formTitle{font:18px "Google Sans"}
.meta{font-size:13px;color:var(--muted);margin:6px 0 15px}
.link{display:flex;gap:8px;background:#f3edfb;border:1px solid var(--p);padding:10px;border-radius:5px}
.link input{border:0;background:transparent;flex:1;min-width:0}
.option{display:flex;align-items:center;gap:10px;padding:13px 3px;border-bottom:1px solid #eee}
.option input{width:auto}
.option label{flex:1;margin:0}
.seat{font-size:12px;padding:4px 8px;border-radius:12px;white-space:nowrap}
.open{color:var(--green);background:#e6f4ea}
.low{color:var(--orange);background:#fef3e0}
.full{color:var(--red);background:#fce8e6}
.center{text-align:center}
.check{font-size:50px;color:var(--green)}
@media(max-width:600px){
 .page{padding:12px 8px 50px}
 .card{padding:18px}
 .row{grid-template-columns:1fr}
 .nav{align-items:flex-start;flex-direction:column}
 .link{flex-direction:column}
 .link button{width:100%}
}
</style>
</head>

<body>
<div class="page" id="app"></div>

<script>
const app=document.getElementById("app");
const formID=new URLSearchParams(location.search).get("form");

function esc(v){
 const d=document.createElement("div");
 d.textContent=v==null?"":String(v);
 return d.innerHTML;
}

async function api(url,opt={}){
 try{
  const r=await fetch(url,{
   credentials:"same-origin",
   ...opt,
   headers:{
    ...(opt.body?{"Content-Type":"application/json"}:{}),
    ...(opt.headers||{})
   }
  });
  const text=await r.text();
  try{return JSON.parse(text)}
  catch{return {ok:false,error:"Server returned an invalid response."}}
 }catch(e){
  return {ok:false,error:e.message||"Network error"};
 }
}

start();

async function start(){
 if(formID)return student(formID);
 const me=await api("/api/me");
 if(me.ok&&me.teacher)dashboard(me.teacher);
 else login();
}


/* LOGIN */

function login(){
 app.innerHTML=`
 <div class="bar"></div>
 <div class="card first">
  <h1>Teacher Login</h1>
  <p class="desc">Log in to create and manage elective registration forms.</p>
 </div>
 <div class="card">
  <div class="field">
   <label>Email <span class="req">*</span></label>
   <input id="email" type="email" placeholder="teacher@example.com">
  </div>
  <div class="field">
   <label>Password <span class="req">*</span></label>
   <input id="password" type="password" placeholder="Password">
  </div>
  <div id="msg"></div>
  <button class="primary" id="go">Log in</button>
  <div class="auth">New here? <span id="signup">Create an account</span></div>
 </div>`;
 document.getElementById("go").onclick=doLogin;
 document.getElementById("signup").onclick=signup;
}

async function doLogin(){
 const b=document.getElementById("go");
 b.disabled=true;
 const r=await api("/api/login",{
  method:"POST",
  body:JSON.stringify({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
  })
 });
 if(r.ok){
  const me=await api("/api/me");
  dashboard(me.teacher);
 }else{
  document.getElementById("msg").innerHTML=`<div class="error">${esc(r.error)}</div>`;
  b.disabled=false;
 }
}


/* SIGNUP */

function signup(){
 app.innerHTML=`
 <div class="bar"></div>
 <div class="card first">
  <h1>Create Teacher Account</h1>
  <p class="desc">Create your account once to manage your forms.</p>
 </div>
 <div class="card">
  <div class="field">
   <label>Name</label>
   <input id="name" placeholder="Your name">
  </div>
  <div class="field">
   <label>Email <span class="req">*</span></label>
   <input id="email" type="email" placeholder="teacher@example.com">
  </div>
  <div class="field">
   <label>Password <span class="req">*</span></label>
   <input id="password" type="password" placeholder="At least 6 characters">
  </div>
  <div id="msg"></div>
  <button class="primary" id="go">Sign up</button>
  <div class="auth">Already have an account? <span id="login">Log in</span></div>
 </div>`;
 document.getElementById("go").onclick=doSignup;
 document.getElementById("login").onclick=login;
}

async function doSignup(){
 const b=document.getElementById("go");
 b.disabled=true;
 const r=await api("/api/signup",{
  method:"POST",
  body:JSON.stringify({
   name:document.getElementById("name").value.trim(),
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
  })
 });
 if(r.ok){
  const me=await api("/api/me");
  dashboard(me.teacher);
 }else{
  document.getElementById("msg").innerHTML=`<div class="error">${esc(r.error)}</div>`;
  b.disabled=false;
 }
}


/* DASHBOARD */

async function dashboard(teacher){
 app.innerHTML=`
 <div class="nav">
  <div>
   <div class="brand">Elective Registration</div>
   <div class="user">${esc(teacher.name||teacher.email)}</div>
  </div>
  <div class="actions">
   <button class="secondary" id="logout">Logout</button>
   <button class="primary" id="new">+ Create Form</button>
  </div>
 </div>
 <div id="forms"><div class="card center">Loading forms...</div></div>`;

 document.getElementById("logout").onclick=logout;
 document.getElementById("new").onclick=builder;

 const r=await api("/api/forms");

 if(!r.ok){
  document.getElementById("forms").innerHTML=
   `<div class="card"><div class="error">${esc(r.error)}</div></div>`;
  return;
 }

 if(!r.forms.length){
  document.getElementById("forms").innerHTML=`
   <div class="card center">
    <h2>No forms yet</h2>
    <p class="muted">Create your first elective registration form.</p>
    <button class="primary" onclick="builder()">+ Create Form</button>
   </div>`;
  return;
 }

 document.getElementById("forms").innerHTML=r.forms.map(f=>`
  <div class="card">
   <div class="formTitle">${esc(f.title)}</div>
   <div class="meta">${esc(f.description||"No description")}</div>
   <div class="meta">${f.totalTaken} responses / ${f.totalCapacity} seats</div>
   <div class="actions">
    <button class="primary" onclick="openForm('${f.id}')">Open Link</button>
    <button class="secondary" onclick="csv('${f.id}')">Download CSV</button>
   </div>
  </div>`).join("");
}

async function logout(){
 await api("/api/logout",{method:"POST"});
 location.reload();
}

function openForm(id){
 location.href="/?form="+encodeURIComponent(id);
}

async function csv(id){
 const r=await fetch("/api/forms/"+encodeURIComponent(id)+"/export",{
  credentials:"same-origin"
 });
 if(!r.ok){alert("Could not download CSV.");return}
 const blob=await r.blob();
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="elective-responses.csv";
 a.click();
 URL.revokeObjectURL(url);
}


/* BUILDER */

function builder(){
 app.innerHTML=`
 <div class="nav">
  <div class="brand">Create Elective Form</div>
  <button class="secondary" onclick="location.reload()">← Dashboard</button>
 </div>

 <div class="card">
  <h1>New Registration Form</h1>
  <div class="field">
   <label>Form title <span class="req">*</span></label>
   <input id="title" placeholder="Semester Elective Registration">
  </div>
  <div class="field">
   <label>Description</label>
   <textarea id="description" placeholder="Instructions for students..."></textarea>
  </div>
 </div>

 <div class="card">
  <h2>Electives</h2>
  <p class="desc">Add each elective and its maximum number of seats.</p>
  <div id="rows"></div>
  <button class="secondary" id="add">+ Add Elective</button>
 </div>

 <div id="msg"></div>

 <div class="card">
  <button class="primary" id="create">Create Form</button>
 </div>

 <div id="share"></div>`;

 const rows=document.getElementById("rows");

 function addRow(name="",cap=""){
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`
   <input class="en" placeholder="Elective name" value="${esc(name)}">
   <input class="ec" type="number" min="1" placeholder="Seats" value="${esc(cap)}">
   <button class="danger remove">Remove</button>`;
  row.querySelector(".remove").onclick=()=>row.remove();
  rows.appendChild(row);
 }

 addRow();

 document.getElementById("add").onclick=()=>addRow();

 document.getElementById("create").onclick=async()=>{
  const title=document.getElementById("title").value.trim();
  const description=document.getElementById("description").value.trim();

  const electives=[...rows.querySelectorAll(".row")].map(x=>({
   name:x.querySelector(".en").value.trim(),
   capacity:Number(x.querySelector(".ec").value)
  })).filter(x=>x.name&&x.capacity>0);

  if(!title){
   document.getElementById("msg").innerHTML=
    `<div class="error">Please enter a form title.</div>`;
   return;
  }

  if(!electives.length){
   document.getElementById("msg").innerHTML=
    `<div class="error">Add at least one elective with seats.</div>`;
   return;
  }

  const b=document.getElementById("create");
  b.disabled=true;
  b.textContent="Creating...";

  const r=await api("/api/forms",{
   method:"POST",
   body:JSON.stringify({title,description,electives})
  });

  if(!r.ok){
   document.getElementById("msg").innerHTML=
    `<div class="error">${esc(r.error)}</div>`;
   b.disabled=false;
   b.textContent="Create Form";
   return;
  }

  const link=location.origin+"/?form="+encodeURIComponent(r.formId);

  document.getElementById("share").innerHTML=`
   <div class="card">
    <h2>Form Created 🎉</h2>
    <p class="desc">Send this link to your students.</p>
    <div class="link">
     <input id="shareLink" readonly value="${esc(link)}">
     <button class="primary" id="copy">Copy</button>
    </div>
    <br>
    <button class="primary" onclick="openForm('${r.formId}')">Open Student Form</button>
    <button class="secondary" onclick="location.reload()">Dashboard</button>
   </div>`;

  document.getElementById("copy").onclick=async()=>{
   const input=document.getElementById("shareLink");
   try{
    await navigator.clipboard.writeText(input.value);
   }catch{
    input.select();
    document.execCommand("copy");
   }
   document.getElementById("copy").textContent="Copied!";
  };

  b.textContent="Created";
 };
}


/* STUDENT */

async function student(id){

 app.innerHTML=`
  <div class="bar"></div>
  <div class="card center"><h2>Loading form...</h2></div>`;

 const r=await api("/api/public/forms/"+encodeURIComponent(id));

 if(!r.ok){
  app.innerHTML=`
   <div class="bar"></div>
   <div class="card">
    <h1>Form unavailable</h1>
    <div class="error">${esc(r.error)}</div>
   </div>`;
  return;
 }

 let form=r.form;

 function draw(){
  app.innerHTML=`
   <div class="bar"></div>

   <div class="card first">
    <h1>${esc(form.title)}</h1>
    ${form.description?`<p class="desc">${esc(form.description)}</p>`:""}
   </div>

   <div class="card">

    <div class="field">
     <label>Student Name <span class="req">*</span></label>
     <input id="sname" placeholder="Enter your name">
    </div>

    <div class="field">
     <label>Register Number <span class="req">*</span></label>
     <input id="reg" placeholder="Enter register number">
    </div>

    <div class="field">
     <label>Email <span class="req">*</span></label>
     <input id="email" type="email" placeholder="your@email.com">
    </div>

    <div class="field">
     <label>Choose Elective <span class="req">*</span></label>
     <div id="options">
      ${form.electives.map((e,i)=>{
       const rem=Number(e.remaining||0);
       const cap=Number(e.capacity||1);
       const cls=rem<=0?"full":rem/cap<=.2?"low":"open";
       const txt=rem<=0?"Full":rem+" left";
       return `
        <div class="option">
         <input type="radio" name="elective" id="e${i}"
          value="${esc(e.id)}" ${rem<=0?"disabled":""}>
         <label for="e${i}">${esc(e.name)}</label>
         <span class="seat ${cls}">${txt}</span>
        </div>`;
      }).join("")}
     </div>
    </div>

    <div id="msg"></div>

    <button class="primary" id="submit">Submit</button>
   </div>`;

  document.getElementById("submit").onclick=submit;
 }

 async function submit(){

  const name=document.getElementById("sname").value.trim();
  const reg=document.getElementById("reg").value.trim();
  const email=document.getElementById("email").value.trim();
  const chosen=document.querySelector('input[name="elective"]:checked');
  const msg=document.getElementById("msg");

  if(!name||!reg||!email||!chosen){
   msg.innerHTML=`<div class="error">Please fill in all fields and choose an elective.</div>`;
   return;
  }

  const b=document.getElementById("submit");
  b.disabled=true;
  b.textContent="Submitting...";

  const r=await api(
   "/api/public/forms/"+encodeURIComponent(id)+"/responses",
   {
    method:"POST",
    body:JSON.stringify({
     name,
     registerNo:reg,
     email,
     electiveId:chosen.value
    })
   }
  );

  if(r.ok){
   app.innerHTML=`
    <div class="bar"></div>
    <div class="card center">
     <div class="check">✓</div>
     <h1>Registration Successful</h1>
     <p class="desc">${esc(r.message)}</p>
     <p>Your response has been recorded.</p>
    </div>`;
  }else{
   msg.innerHTML=`<div class="error">${esc(r.error)}</div>`;
   b.disabled=false;
   b.textContent="Submit";
   refresh();
  }
 }

 async function refresh(){
  const latest=await api(
   "/api/public/forms/"+encodeURIComponent(id)
  );
  if(!latest.ok)return;

  form=latest.form;

  form.electives.forEach(e=>{
   const radio=document.querySelector(
    `input[name="elective"][value="${e.id}"]`
   );
   if(!radio)return;

   const option=radio.closest(".option");
   const seat=option.querySelector(".seat");
   const rem=Number(e.remaining||0);
   const cap=Number(e.capacity||1);

   seat.textContent=rem<=0?"Full":rem+" left";
   seat.className="seat "+
    (rem<=0?"full":rem/cap<=.2?"low":"open");

   radio.disabled=rem<=0;
  });
 }

 draw();

 setInterval(refresh,5000);
}

</script>
</body>
  </html>
